<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ed">
  <meta name="description" content="何気ない今日を、あとで宝物に。写真とひとことを、あなたの端末だけに残す小さな写真日記。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; worker-src 'self'">
  <title>ひとこま — 写真と、ひとこと。</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">日記へスキップ</a>
  <aside class="sidebar" aria-label="メインメニュー">
    <a class="brand" href="./" aria-label="ひとこま ホーム"><img src="./assets/icon.svg" width="38" height="38" alt=""><span>ひとこま<small>写真と、ひとこと。</small></span></a>
    <span class="demo-badge">デモ</span>
    <nav class="desktop-nav"><button data-view="timeline" class="nav-button active"></button><button data-view="calendar" class="nav-button"></button></nav>
    <div class="sidebar-bottom"><p>今日のかけらを、<br>未来のわたしへ。</p><button class="nav-button" data-action="settings"></button><span class="local-note"></span></div>
  </aside>
  <header class="mobile-header"><a class="brand" href="./"><img src="./assets/icon.svg" width="31" height="31" alt=""><span>ひとこま</span></a><div><span class="demo-badge">デモ</span><button class="icon-button" data-action="settings" aria-label="設定"></button></div></header>
  <main id="main" tabindex="-1">
    <div class="page-top"><span class="eyebrow">MY LITTLE JOURNAL</span><span class="today-label" id="todayLabel"></span></div>
    <section class="intro"><div><h1>何気ない今日を、<br>あとで宝物に。</h1><p>写真とひとこと。手帳に書く、その前に。</p></div><button class="primary desktop-record" data-action="create"></button><div class="intro-stamp" aria-hidden="true"><span>日々</span><small>のきろく</small></div></section>
    <div class="section-toolbar"><div class="view-title"><h2 id="viewTitle">日々のきろく</h2><span id="entryCount" class="count"></span></div><button class="icon-button search-toggle" data-action="search" aria-label="メモを検索" aria-expanded="false"></button></div>
    <div class="search-wrap" id="searchWrap" hidden><label for="searchInput" class="sr-only">メモのキーワード</label><span id="searchIcon" aria-hidden="true"></span><input id="searchInput" type="search" placeholder="メモの言葉で、あの日を探す" maxlength="200" autocomplete="off"><button class="text-button" data-action="clear-search">閉じる</button></div>
    <div class="sample-notice" id="sampleNotice"><span><i></i>サンプルの日記を表示しています</span><button data-action="hide-samples" class="text-button">非表示にする</button></div>
    <section id="content" aria-label="日記の一覧" aria-live="polite"><div class="loading-state">日記をひらいています…</div></section>
    <footer class="page-footer"><img src="./assets/icon.svg" width="24" height="24" alt=""><span>なんでもない日も、たいせつな一日。</span></footer>
  </main>
  <nav class="mobile-nav" aria-label="メインメニュー"><button data-view="timeline" class="active"></button><button data-view="calendar"></button><button data-action="create" class="mobile-record"></button></nav>
  <dialog id="modal" aria-labelledby="modalTitle"></dialog>
  <dialog id="confirmModal" class="confirm-modal" aria-labelledby="confirmTitle"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">ひとこまを使うには、ブラウザのJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
